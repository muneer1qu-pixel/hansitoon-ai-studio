
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HansiToon AI Studio</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b0815;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:22px 16px;
 background:#171027;
 border-bottom:1px solid #38245e;
}
.logo{font-size:23px;font-weight:bold;color:#c69aff}
.logo span{color:white}
header p{color:#aaa;font-size:12px}
main{padding:18px;max-width:650px;margin:auto}
h2{font-size:23px}
.sub{color:#aaa;font-size:14px}
.card{
 background:#171327;border:1px solid #352650;
 border-radius:15px;padding:17px;margin:17px 0;
}
label{display:block;margin:14px 0 8px}
textarea,select{
 width:100%;padding:13px;border-radius:10px;
 background:#0e0b19;color:white;
 border:1px solid #49346d;font-size:15px;
}
textarea{height:110px;resize:vertical}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{
 padding:13px;border:0;border-radius:10px;
 background:#873bea;color:white;font-weight:bold;
 font-size:14px;cursor:pointer;
}
button.secondary{background:#302344}
button:active{opacity:.7}
.note{color:#aaa;font-size:12px;line-height:1.6}
footer{text-align:center;color:#777;padding:25px}
</style>
</head>
<body>
<header>
 <div class="logo">HansiToon <span>AI Studio</span></div>
 <p>Turn Your Imagination Into Reality ✨</p>
</header>
<main>
 <h2>अपना AI Creation बनाएं</h2>
 <p class="sub">अपनी कल्पना को इमेज और वीडियो में बदलें।</p>

 <div class="card">
  <label>अपना Prompt लिखें</label>
  <textarea id="prompt" placeholder="अपनी कहानी या इमेज का विवरण लिखें..."></textarea>

  <label>Creation Type</label>
  <select id="type">
   <option>Text to Image</option>
   <option>Text to Video</option>
   <option>Image to Video</option>
  </select>

  <label>Video Duration</label>
  <select id="duration">
   <option>10 Seconds</option>
   <option>20 Seconds</option>
   <option>30 Seconds</option>
  </select>

  <label>Video Format</label>
  <select id="format">
   <option>9:16 Vertical</option>
   <option>16:9 Landscape</option>
   <option>1:1 Square</option>
  </select>

  <div class="buttons" style="margin-top:20px">
   <button onclick="generate()">Generate ✨</button>
   <button class="secondary" onclick="clearPrompt()">Clear</button>
  </div>
  <p class="note" id="status">AI Generator API जुड़ने के बाद वास्तविक जनरेशन शुरू होगी।</p>
 </div>

 <div class="card">
  <h3>🎨 My Creations</h3>
  <p class="sub">आपकी बनाई गई इमेज और वीडियो यहाँ दिखाई देंगे।</p>
  <div id="result" class="note">अभी कोई Creation नहीं है।</div>
 </div>
</main>
<footer>© 2026 HansiToon AI Studio</footer>
<script>
function generate(){
 let p=document.getElementById('prompt').value.trim();
 if(!p){alert('पहले अपना Prompt लिखें!');return;}
 document.getElementById('status').innerText=
 'आपका Prompt तैयार है। वास्तविक AI जनरेशन के लिए API कनेक्ट करनी होगी।';
 document.getElementById('result').innerText=
 'Selected: '+document.getElementById('type').value+
 ' | Prompt: '+p;
}
function clearPrompt(){
 document.getElementById('prompt').value='';
 document.getElementById('status').innerText='Prompt साफ कर दिया गया।';
}
</script>
</body>
</html>
